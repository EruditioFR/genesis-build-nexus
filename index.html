      <div>
        <h1>Family Garden — Le journal de famille privé et sécurisé</h1>
        <p>Gardez une trace de vos plus beaux souvenirs : photos, vidéos, textes et audio. Family Garden est le journal de famille privé et sécurisé pour préserver et partager vos moments de vie avec vos proches.</p>

        <h2>Fonctionnalités</h2>
        <ul>
          <li>Capsules mémorielles multimédia (texte, photo, vidéo, audio)</li>
          <li>Chronologie interactive par décennies</li>
          <li>Cercles de partage familial sécurisés</li>
          <li>Arbre généalogique interactif avec import/export GEDCOM</li>
          <li>Export PDF haute qualité</li>
          <li>Legs posthume programmé avec gardiens de confiance</li>
          <li>Chiffrement AES-256, serveurs européens conformes RGPD</li>
        </ul>

        <h2>Tarifs</h2>
        <ul>
          <li>14 jours d'essai gratuit, sans carte bancaire</li>
          <li>Abonnement unique : 2,99 €/mois TTC — 20 Go de stockage, tous formats (texte, photo, vidéo, audio), chronologie, cercles de partage, export PDF, legs posthume</li>
          <li>Option arbre généalogique interactif : 5 €/mois</li>
        </ul>

        <h2>Questions fréquentes</h2>
        <h3>Qu'est-ce qu'une capsule temporelle numérique ?</h3>
        <p>Une capsule temporelle numérique rassemble textes, photos, vidéos et enregistrements vocaux pour une ouverture différée, à une date choisie ou par un destinataire précis. Family Garden permet de programmer la révélation de chaque souvenir.</p>
        <h3>Comment conserver ses souvenirs de famille en ligne ?</h3>
        <p>En réunissant vos médias dans un lieu unique, en documentant chaque souvenir (date, lieu, personnes) et en ouvrant l'accès à vos proches. Hébergement européen chiffré, sauvegarde quotidienne, export complet à tout moment.</p>
        <h3>Comment raconter sa vie à ses enfants ?</h3>
        <p>En répondant à une question guidée à la fois, à l'écrit ou à la voix. Family Garden propose plus de cinquante questions et reconstitue automatiquement le récit sur une chronologie.</p>
        <h3>Quelle différence avec un site de généalogie ?</h3>
        <p>Les sites de généalogie remontent le temps via les archives. Family Garden conserve la mémoire vivante — voix, récits, photos — et relie chaque souvenir aux personnes de l'arbre généalogique (import GEDCOM possible).</p>
